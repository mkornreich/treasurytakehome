# Render Blueprint: Dashboard > New > Blueprint > pick this repository.
#
# No plan is set, so Render uses its default 0.5 CPU / 512 MB instance ("0.5c-512mb").
# Measured on that size (Oct 2026): ~1.3 s for a clean label, 3-4 s for a label with
# problems, 4.8-5.4 s for an angled or sideways photo; ~250 MB memory. That is at the
# edge of the 5-second target: a 1 CPU instance is about twice as fast.
# The free instance is too slow for the 5-second target and sleeps when idle.
#
# The app runs on local OCR only. To enable the optional AI reader later, add an
# ANTHROPIC_API_KEY environment variable to the service in the Render Dashboard.
services:
  - type: web
    name: label-check
    runtime: docker
    region: virginia
    healthCheckPath: /api/health
    autoDeployTrigger: commit
